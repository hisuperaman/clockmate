
name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build APK
        run: eas build --platform android --profile preview --non-interactive --wait --json > build.json

      - name: Download APK
        run: |
          mkdir -p dist

          BUILD_URL=$(node -e \
            "const b = require('./build.json'); \
            console.log((Array.isArray(b) ? b[0] : b).artifacts.buildUrl)")

          curl --fail --location "$BUILD_URL" \
            --output dist/app.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/app.apk
          generate_release_notes: true